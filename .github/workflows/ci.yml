##############################################################################
# LikhaPoha AI — Continuous Integration
# Runs on every push and pull request to main.
# Gates: Lint → Test → Build
# All three gates must pass before a PR can be merged.
##############################################################################
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true          # cancel stale runs on force-push

jobs:
  # ── 1. Backend lint + type check ───────────────────────────────────────────
  backend-lint:
    name: "🐍 Backend · Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install linting tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/

  # ── 2. Backend tests ───────────────────────────────────────────────────────
  backend-tests:
    name: "🐍 Backend · Tests"
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "test-supabase-key"
          SUPABASE_ANON_KEY: "test-supabase-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-supabase-service-role-key"
          OPENAI_API_KEY: "test-openai-key"
          VENICE_API_KEY: "test-venice-key"
        run: |
          python -m pytest -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=0

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ── 3. Frontend lint ───────────────────────────────────────────────────────
  frontend-lint:
    name: "⚛️ Frontend · Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings 50

      - name: CSS custom-property tokens
        run: npm run lint:css-tokens

  # ── 4. Frontend unit tests ─────────────────────────────────────────────────
  frontend-tests:
    name: "⚛️ Frontend · Unit Tests"
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

  # ── 5. Frontend E2E tests ───────────────────────────────────────────────────
  # Network calls (Supabase + backend) are mocked per-test (see
  # frontend/e2e/support/mockAuth.js), so this only needs the Vite dev server —
  # no backend, no real Supabase project.
  frontend-e2e:
    name: "🎭 Frontend · E2E"
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chrome
        run: npx playwright install --with-deps chrome

      - name: Start Vite dev server
        env:
          VITE_SUPABASE_URL: "https://test-project.supabase.co"
          VITE_SUPABASE_ANON_KEY: "test-anon-key"
          VITE_API_BASE_URL: "http://localhost:8000"
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 1
          done
          echo "Vite dev server did not become ready in time" && exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  # ── 6. Frontend production build ───────────────────────────────────────────
  frontend-build:
    name: "⚛️ Frontend · Build"
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          VITE_API_BASE_URL: https://api.likhapoha.in
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── 7. CI summary gate ────────────────────────────────────────────────────
  ci-passed:
    name: "✅ CI Passed"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-e2e, frontend-build]
    if: always()
    steps:
      - name: Check all gates
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" || \
                "${{ needs.frontend-e2e.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "❌ One or more CI gates failed."
            exit 1
          fi
          echo "✅ All CI gates passed."
