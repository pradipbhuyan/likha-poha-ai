##############################################################################
# LikhaPoha AI — Continuous Integration
# Runs on every push and pull request to main.
# Gates: Lint → Test → Build
# All three gates must pass before a PR can be merged.
##############################################################################
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true          # cancel stale runs on force-push

jobs:
  # ── 1. Backend lint + type check ───────────────────────────────────────────
  backend-lint:
    name: "🐍 Backend · Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install linting tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/ --select E,F,W --ignore E501

  # ── 2. Backend tests ───────────────────────────────────────────────────────
  backend-tests:
    name: "🐍 Backend · Tests"
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "test-supabase-key"
          SUPABASE_ANON_KEY: "test-supabase-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-supabase-service-role-key"
          OPENAI_API_KEY: "test-openai-key"
          VENICE_API_KEY: "test-venice-key"
        run: |
          python -m pytest -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=0

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ── 3. Frontend lint ───────────────────────────────────────────────────────
  frontend-lint:
    name: "⚛️ Frontend · Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings 50

  # ── 4. Frontend unit tests ─────────────────────────────────────────────────
  frontend-tests:
    name: "⚛️ Frontend · Unit Tests"
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

  # ── 5. Frontend production build ───────────────────────────────────────────
  frontend-build:
    name: "⚛️ Frontend · Build"
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          VITE_API_BASE_URL: "https://cbse-tutor-platform.onrender.com"
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── 6. CI summary gate ────────────────────────────────────────────────────
  ci-passed:
    name: "✅ CI Passed"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: always()
    steps:
      - name: Check all gates
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "❌ One or more CI gates failed."
            exit 1
          fi
          echo "✅ All CI gates passed."
