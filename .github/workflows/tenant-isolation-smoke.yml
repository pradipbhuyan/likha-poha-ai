name: Tenant Isolation Smoke

on:
  workflow_dispatch:

jobs:
  staging-tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install httpx
      - name: Run disposable-account isolation journey
        env:
          TENANT_SMOKE_ALLOW_WRITES: "1"
          TENANT_SMOKE_API_URL: ${{ secrets.STAGING_API_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/scripts/deployed_tenant_isolation_smoke.py
