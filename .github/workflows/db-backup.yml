##############################################################################
# LikhaPoha AI — Weekly Supabase Database Backup
# Replaces the local crontab entry (0 2 * * 0 on a personal laptop), which
# silently stopped firing once the machine wasn't awake at 2 AM every Sunday.
# Runs on GitHub's infrastructure instead, so it no longer depends on any
# single machine being on. GitHub also emails the repo owner automatically
# if a scheduled workflow run fails — no extra notification wiring needed.
##############################################################################
name: Weekly DB Backup

on:
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday, 02:00 UTC
  workflow_dispatch:        # allow an on-demand manual run from the Actions tab

jobs:
  backup:
    name: "🗄️ Supabase Backup"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/backup_db.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backend/backups/*.json.gz
          retention-days: 60   # ~8-9 weekly backups, matching the script's own MAX_BACKUPS_TO_KEEP
          if-no-files-found: error
