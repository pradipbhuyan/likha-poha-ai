name: Initialize Staging Schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INITIALIZE EMPTY STAGING to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  schema-only-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_PROJECT_REF: ewappvtucmbmgptusvaq

    steps:
      - name: Validate confirmation and database targets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "INITIALIZE EMPTY STAGING" ]]; then
            echo "Confirmation did not match; refusing to continue."
            exit 1
          fi
          if [[ -z "$PRODUCTION_DATABASE_URL" || -z "$STAGING_DATABASE_URL" ]]; then
            echo "PRODUCTION_DATABASE_URL and STAGING_DATABASE_URL secrets are required."
            exit 1
          fi
          if [[ "$STAGING_DATABASE_URL" != *"$STAGING_PROJECT_REF"* ]]; then
            echo "STAGING_DATABASE_URL does not target the expected staging project."
            exit 1
          fi
          if [[ "$PRODUCTION_DATABASE_URL" == *"$STAGING_PROJECT_REF"* ]]; then
            echo "PRODUCTION_DATABASE_URL points to staging; refusing to continue."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Require an empty staging public schema
        shell: bash
        run: |
          set -euo pipefail
          relation_count="$({
            psql "$STAGING_DATABASE_URL" \
              --no-psqlrc \
              --set ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command "
                select count(*)
                  from pg_class relation
                  join pg_namespace namespace
                    on namespace.oid = relation.relnamespace
                 where namespace.nspname = 'public'
                   and relation.relkind in ('r', 'p', 'v', 'm', 'S', 'f');
              "
          } | tr -d '[:space:]')"
          if [[ "$relation_count" != "0" ]]; then
            echo "Staging public schema contains $relation_count relations; refusing to overwrite it."
            psql "$STAGING_DATABASE_URL" \
              --no-psqlrc \
              --set ON_ERROR_STOP=1 \
              --command "
                select namespace.nspname as schema_name,
                       relation.relname as relation_name,
                       relation.relkind
                  from pg_class relation
                  join pg_namespace namespace
                    on namespace.oid = relation.relnamespace
                 where namespace.nspname = 'public'
                   and relation.relkind in ('r', 'p', 'v', 'm', 'S', 'f')
                 order by relation.relname;
              "
            exit 1
          fi

      - name: Dump production public schema without data
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump \
            --db-url "$PRODUCTION_DATABASE_URL" \
            --schema public \
            --file "$RUNNER_TEMP/production-public-schema.sql"
          test -s "$RUNNER_TEMP/production-public-schema.sql"
          if grep -Eq '^(COPY |INSERT INTO )' "$RUNNER_TEMP/production-public-schema.sql"; then
            echo "Unexpected table data found in schema dump; refusing to restore."
            exit 1
          fi

      - name: Restore schema into empty staging project
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_DATABASE_URL" \
            --no-psqlrc \
            --single-transaction \
            --set ON_ERROR_STOP=1 \
            --command 'ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;' \
            --file "$RUNNER_TEMP/production-public-schema.sql"

      - name: Verify required tables and absence of copied records
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_DATABASE_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --command "
              do \$verify\$
              begin
                if to_regclass('public.profiles') is null
                   or to_regclass('public.student_progress') is null
                   or to_regclass('public.test_history') is null
                   or to_regclass('public.teacher_student_assignments') is null then
                  raise exception 'One or more required staging tables are missing';
                end if;
              end
              \$verify\$;

              do \$verify_empty\$
              declare
                copied_rows bigint;
              begin
                select
                  (select count(*) from public.profiles)
                  + (select count(*) from public.student_progress)
                  + (select count(*) from public.test_history)
                  + (select count(*) from public.teacher_student_assignments)
                  into copied_rows;
                if copied_rows <> 0 then
                  raise exception 'Schema copy unexpectedly included % application rows', copied_rows;
                end if;
              end
              \$verify_empty\$;
            "
          echo "Staging schema initialized successfully with no production application rows."

      - name: Remove temporary schema dump
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/production-public-schema.sql"
