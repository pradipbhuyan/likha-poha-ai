##############################################################################
# LikhaPoha AI — Security Scanning
# Runs weekly + on every push to main.
# Scans: Python deps (Safety) + Node deps (npm audit) + secrets (Gitleaks)
##############################################################################
name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"   # Every Monday at 02:00 UTC

jobs:
  python-deps:
    name: "🔒 Python · Dependency Audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip install -r requirements.txt --quiet
          pip-audit --skip-editable || true
        # `|| true` — report but don't block (upgrade to fail when you pin all deps)

  node-deps:
    name: "🔒 Node · Dependency Audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high || true
        # Warn on high/critical, don't block on moderate

  secrets-scan:
    name: "🔒 Secrets · Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for secret scanning

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # report but don't hard-fail for now
