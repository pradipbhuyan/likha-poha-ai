##############################################################################
# LikhaPoha AI — Continuous Deployment
#
# Triggers ONLY when all CI jobs pass on a push to main.
# Flow: CI passes → Trigger Render deploys → Smoke test → Notify
#
# Required GitHub Secrets (set in repo → Settings → Secrets → Actions):
#   RENDER_BACKEND_DEPLOY_HOOK_URL  — from Render dashboard → backend service → Deploy hook
#   RENDER_FRONTEND_DEPLOY_HOOK_URL — from Render dashboard → frontend service → Deploy hook
#   RENDER_BACKEND_SERVICE_ID       — Render backend service ID (srv-xxx)
#   RENDER_API_KEY                  — Render API key (Account → API Keys)
#   PRODUCTION_URL                  — https://likhapoha.in
#   SLACK_WEBHOOK_URL               — (optional) Slack incoming webhook for notifications
##############################################################################
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    # Only deploy when CI fully succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: "Deploy backend to Render"
        run: |
          echo "Triggering Render backend deploy..."
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}"
        env:
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: "Deploy frontend to Render (or Vercel)"
        run: |
          if [ -z "$RENDER_FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "⏭️  RENDER_FRONTEND_DEPLOY_HOOK_URL not set — skipping frontend deploy."
            exit 0
          fi
          echo "Triggering Render frontend deploy..."
          curl -s -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -o /dev/null -w "HTTP %{http_code}"
        env:
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: "Wait for backend to be ready (max 10 min)"
        run: |
          echo "Giving Render 30 seconds to register the deploy..."
          sleep 30
          echo "Polling backend health check (max 10 minutes)..."
          for i in $(seq 1 60); do
            # -L follows HTTP→HTTPS redirects (307/301) that Render may issue
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" \
              "${{ secrets.PRODUCTION_URL }}/api/health" 2>/dev/null || echo "000")
            echo "Attempt $i/60: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Backend health check timed out after 10 minutes"
          exit 1

  # ── Post-deploy smoke tests ─────────────────────────────────────────────────
  smoke-test:
    name: "🔍 Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - name: "API health check"
        run: |
          echo "--- /api/health ---"
          # -L follows redirects; -s silent; capture body and status separately
          BODY=$(curl -s -L "${{ secrets.PRODUCTION_URL }}/api/health" 2>/dev/null || true)
          HTTP=$(curl -s -L -o /dev/null -w "%{http_code}" \
            "${{ secrets.PRODUCTION_URL }}/api/health" 2>/dev/null || echo "000")
          echo "HTTP $HTTP"
          echo "Body: $BODY"
          if [ "$HTTP" != "200" ]; then
            echo "❌ /api/health returned HTTP $HTTP (expected 200)"
            exit 1
          fi
          python3 -c "
          import json, sys
          body = '''$BODY'''
          try:
            d = json.loads(body)
            assert d.get('status') == 'ok' or d.get('success') == True, f'Unexpected: {d}'
            print('✅ /api/health OK')
          except Exception as e:
            print(f'⚠️  /api/health JSON parse warning: {e}')
            print('✅ /api/health reachable (HTTP 200)')
          "

      - name: "Syllabus endpoint check"
        run: |
          echo "--- /api/syllabus/grades ---"
          HTTP=$(curl -s -L -o /dev/null -w "%{http_code}" \
            "${{ secrets.PRODUCTION_URL }}/api/syllabus/grades")
          echo "HTTP $HTTP"
          [ "$HTTP" = "200" ] && echo "✅ Syllabus endpoint OK" || \
            { echo "❌ Syllabus endpoint returned $HTTP"; exit 1; }

      - name: "Landing page check"
        run: |
          echo "--- Frontend landing page ---"
          HTTP=$(curl -s -L -o /dev/null -w "%{http_code}" \
            "${{ secrets.PRODUCTION_URL }}")
          echo "HTTP $HTTP"
          [ "$HTTP" = "200" ] && echo "✅ Frontend OK" || \
            { echo "❌ Frontend returned $HTTP"; exit 1; }

  # ── Deployment notification ─────────────────────────────────────────────────
  notify:
    name: "📣 Notify"
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always()

    steps:
      - name: "Slack — deploy success"
        if: ${{ needs.smoke-test.result == 'success' }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⏭️  SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ *LikhaPoha AI deployed successfully* to production\n• Commit: `${{ github.sha }}`\n• Branch: `main`\n• All smoke tests passed."
            }'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: "Slack — deploy failure"
        if: ${{ needs.deploy.result == 'failure' || needs.smoke-test.result == 'failure' }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⏭️  SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ *LikhaPoha AI deploy FAILED*\n• Commit: `${{ github.sha }}`\n• Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: "Log deploy outcome"
        run: |
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Smoke:  ${{ needs.smoke-test.result }}"
          if [[ "${{ needs.smoke-test.result }}" == "success" ]]; then
            echo "🎉 Production deployment complete!"
          elif [[ "${{ needs.deploy.result }}" == "skipped" || "${{ needs.smoke-test.result }}" == "skipped" ]]; then
            echo "⏭️  Deployment skipped — CI did not pass or no deploy was triggered. Nothing to do."
            exit 0
          else
            echo "⚠️  Deployment or smoke tests failed. Review the logs."
            exit 1
          fi
