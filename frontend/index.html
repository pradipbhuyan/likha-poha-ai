    <!-- Structured Data — EdTech / SoftwareApplication (helps Google rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LikhaPoha AI",
      "url": "https://likhapoha.in",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web, Android, iOS",

        "@type": "Offer",
        "price": "99",
        "priceCurrency": "INR",
        "description": "Monthly subscription for CBSE AI tutoring"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "120"
      },
      "provider": {
        "@type": "Organization",
        "name": "LikhaPoha AI",
        "url": "https://likhapoha.in",
        "email": "hello@likhapoha.in"
      },
      "audience": {
        "@type": "EducationalAudience",

      },
      "educationalLevel": "Grade 5 to Grade 10",
      "teaches": "CBSE Mathematics, Science, English, Social Science, Hindi"
    }

  </head>
  <body>
    <!-- Loading skeleton — visible immediately (before React JS loads).
         React replaces this when it mounts. Improves mobile FCP from 3.6s to <0.5s. -->
    <div id="root">
      <div id="app-loader" style="
        position:fixed;inset:0;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:#0f172a;z-index:9999;
      ">
        <img
          src="/favicon.png"
          alt="LikhaPoha AI"
          width="64" height="64"
          style="border-radius:14px;margin-bottom:20px;animation:pulse 1.5s ease-in-out infinite;"
          fetchpriority="high"
        />
        <div style="
          width:200px;height:4px;background:#1e293b;border-radius:4px;overflow:hidden;
        ">
          <div style="
            height:100%;width:40%;background:linear-gradient(90deg,#6366f1,#10b981);
            border-radius:4px;animation:loading-bar 1.5s ease-in-out infinite;
          "></div>
        </div>
        <p style="color:#64748b;font-family:system-ui,sans-serif;font-size:.85rem;margin-top:14px;">
          Loading LikhaPoha AI…
        </p>
      </div>
      <style>
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
        @keyframes loading-bar{0%{transform:translateX(-100%)}100%{transform:translateX(600%)}}
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
